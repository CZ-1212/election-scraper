name: Scrape Election Results

# MANUAL TRIGGER ONLY — no automatic schedule.
#
# How to run:
#   1. GitHub → Actions → "Scrape Election Results" → "Run workflow"
#   2. Fill in the options below and click the green "Run workflow" button.
#
# Reporters: use the defaults for a standard election night update.
# The only input you typically need to change is "Counties to scrape"
# if you only want to refresh a subset.

on:
  workflow_dispatch:
    inputs:

      scraper:
        description: >
          Counties to scrape.
          "both" runs all 13 counties.
          "clarity" runs only Contra Costa, Marin, Santa Clara, Sonoma (fastest, ~5 min).
          "non-clarity" runs the other 9 counties.
        required: true
        default: "both"
        type: choice
        options:
          - both
          - clarity
          - non-clarity

      use_live_urls:
        description: >
          Use election-night live URLs (checked = yes, live results).
          Uncheck to use test/zero-report URLs instead.
        required: true
        default: true
        type: boolean

      update_sheets:
        description: >
          Update the Google Sheets dashboard after scraping.
          Uncheck to scrape and normalize only (useful for quick data checks).
        required: true
        default: true
        type: boolean

# Allow writing back to the repo (for the data file commit).
permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    # Render every timestamp in Pacific time to match the master JSON and Google Sheet.
    env:
      TZ: America/Los_Angeles

    steps:

      # 1. Log what this run will do — creates a clear audit trail in the Actions log.
      - name: Log run parameters
        run: |
          echo "============================================================"
          echo "SCRAPE RUN — $(date '+%Y-%m-%d %H:%M %Z')"
          echo "  Triggered by : ${{ github.actor }}"
          echo "  Scraper      : ${{ inputs.scraper }}"
          echo "  Live URLs    : ${{ inputs.use_live_urls }}"
          echo "  Update Sheets: ${{ inputs.update_sheets }}"
          echo "============================================================"

      # 2. Check out the repo.
      - name: Check out repository
        uses: actions/checkout@v4

      # 3. Set up Python to match local development.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 4. Install Chrome for the Clarity scraper (Selenium).
      #    Selenium 4.6+ auto-downloads a matching ChromeDriver once Chrome is installed.
      - name: Install Google Chrome
        id: install_chrome
        continue-on-error: true
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/google-chrome.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] \
            http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable
          echo "Chrome version: $(google-chrome --version)"

      # 5. Create the virtual environment and install all dependencies.
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      # 6. Write the .env file from GitHub Secrets.
      - name: Write .env from secrets
        run: |
          cat > .env << 'EOF'
          GOOGLE_SERVICE_ACCOUNT_JSON=/home/runner/work/election-scraper/election-scraper/service-account-key.json
          GOOGLE_SHEET_ID=${{ secrets.GOOGLE_SHEET_ID }}
          WP_SITE_URL=${{ secrets.WP_SITE_URL }}
          WP_USERNAME=${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD=${{ secrets.WP_APP_PASSWORD }}
          WP_PAGE_IDS=${{ secrets.WP_PAGE_IDS }}
          EOF

      # 7. Write the Google service account key from the secret.
      - name: Write Google service account key
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > service-account-key.json

      # 8. Run the full pipeline: sync county links → scrape → normalize → render → sheets.
      #    Flags are built from the workflow inputs above.
      #    run_all.py chains all steps internally — no need for separate normalize or sheets calls.
      - name: Run pipeline
        id: pipeline
        continue-on-error: true
        run: |
          source venv/bin/activate

          # Build the command from inputs
          CMD="python run_all.py --scraper ${{ inputs.scraper }}"

          # Live vs test URLs
          if [ "${{ inputs.use_live_urls }}" != "true" ]; then
            CMD="$CMD --no-live"
          fi

          # Google Sheets update
          if [ "${{ inputs.update_sheets }}" != "true" ]; then
            CMD="$CMD --no-sheets"
          fi

          echo "Running: $CMD"
          eval $CMD
        env:
          DISPLAY: ""

      # 9. Commit the updated data files back to the repo.
      #    Only commits when there are actual changes — avoids empty commits.
      #    Reporters pulling the repo locally will then see the latest data.
      - name: Commit updated election data
        id: commit
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/election_results_master.json \
                  data/processed/vote_count_state.json \
                  data/processed/wp_inject_state.json
          git diff --staged --quiet || \
            git commit -m "chore: auto-update election results [$(date '+%Y-%m-%d %H:%M %Z')]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 10. Print a final summary of every step.
      - name: Pipeline summary
        if: always()
        run: |
          echo "============================================================"
          echo "PIPELINE SUMMARY — $(date '+%Y-%m-%d %H:%M %Z')"
          echo "  Triggered by : ${{ github.actor }}"
          echo "  Scraper      : ${{ inputs.scraper }}"
          echo "  Live URLs    : ${{ inputs.use_live_urls }}"
          echo "  Update Sheets: ${{ inputs.update_sheets }}"
          echo "------------------------------------------------------------"
          echo "  Chrome install : ${{ steps.install_chrome.outcome }}"
          echo "  Pipeline run   : ${{ steps.pipeline.outcome }}"
          echo "  Git commit     : ${{ steps.commit.outcome }}"
          echo "============================================================"

          if [ "${{ steps.pipeline.outcome }}" = "failure" ]; then
            echo "::error::Pipeline step failed. Check the 'Run pipeline' log above for details."
            exit 1
          fi

          echo "Scrape complete."
