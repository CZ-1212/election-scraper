name: Publish to WordPress

# MANUAL TRIGGER ONLY — this workflow has no automatic schedule.
#
# How to run:
#   1. Run "Scrape Election Results" first to get fresh data.
#   2. Review the Google Sheet to confirm the numbers look correct.
#   3. GitHub → Actions → "Publish to WordPress" → "Run workflow"
#   4. Fill in the confirmation message exactly as shown, then click "Run workflow".
#
# This workflow reads the master JSON already committed to the repo —
# it does NOT re-scrape. Run the scrape workflow first if you want fresh data.

on:
  workflow_dispatch:
    inputs:

      confirmation:
        description: >
          Type exactly: I have reviewed the Google Sheet and data is ready to publish
        required: true
        type: string

      counties:
        description: >
          Counties to publish (comma-separated, e.g. "Marin,Santa_Clara,San_Mateo").
          Leave blank to publish ALL 13 counties.
          Use this to hold back a county that is showing bad data.
        required: false
        default: ""
        type: string

      force:
        description: >
          Force push even if vote tallies have not changed since the last publish.
          Use this after a template update or when troubleshooting a county page.
        required: false
        default: false
        type: boolean

# Write permission needed to commit the inject state file back to the repo.
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      TZ: America/Los_Angeles

    steps:

      # 1. Validate the confirmation message before touching anything.
      #    If the text doesn't match exactly, the job fails immediately.
      - name: Validate confirmation
        run: |
          EXPECTED="I have reviewed the Google Sheet and data is ready to publish"
          ACTUAL="${{ github.event.inputs.confirmation }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Confirmation message did not match. Nothing was published."
            echo "  Expected: $EXPECTED"
            echo "  Got:      $ACTUAL"
            exit 1
          fi
          echo "Confirmation accepted."

      # 2. Log this run for the audit trail.
      - name: Log publish parameters
        run: |
          echo "============================================================"
          echo "WORDPRESS PUBLISH — $(date '+%Y-%m-%d %H:%M %Z')"
          echo "  Triggered by : ${{ github.actor }}"
          COUNTIES="${{ github.event.inputs.counties }}"
          echo "  Counties     : ${COUNTIES:-ALL}"
          echo "  Force push   : ${{ inputs.force }}"
          echo "============================================================"

      # 3. Check out the repo — this gives us the master JSON committed by the scrape workflow.
      - name: Check out repository
        uses: actions/checkout@v4

      # 4. Set up Python.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 5. Install dependencies.
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      # 6. Write .env from GitHub Secrets.
      - name: Write .env from secrets
        run: |
          cat > .env << 'EOF'
          GOOGLE_SERVICE_ACCOUNT_JSON=/home/runner/work/election-scraper/election-scraper/service-account-key.json
          GOOGLE_SHEET_ID=${{ secrets.GOOGLE_SHEET_ID }}
          WP_SITE_URL=${{ secrets.WP_SITE_URL }}
          WP_USERNAME=${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD=${{ secrets.WP_APP_PASSWORD }}
          WP_PAGE_IDS=${{ secrets.WP_PAGE_IDS }}
          EOF

      # 7. Write the Google service account key.
      - name: Write Google service account key
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > service-account-key.json

      # 8. Re-render per-county HTML from the committed master JSON.
      #    This always uses the current template — no stale HTML carried over from the scrape run.
      #    --dry-run skips scraping; --render builds output/election_night/{County}.html.
      - name: Render per-county HTML
        id: render
        run: |
          source venv/bin/activate
          python run_all.py --dry-run --render --no-sheets
        env:
          DISPLAY: ""

      # 9. Push rendered HTML to each county's WordPress page.
      #    Reads WP_PAGE_IDS from .env to map county name → page ID.
      #    Uses the Gutenberg Custom HTML block so <style> tags survive WordPress's kses filter.
      #    Hash-based skip: only pushes a county if vote tallies changed since the last publish
      #    (or if --force is checked above).
      - name: Push to WordPress
        id: publish
        run: |
          source venv/bin/activate

          COUNTIES="${{ github.event.inputs.counties }}"
          FORCE="${{ inputs.force }}"

          CMD="python export/to_wordpress.py --push-rendered"

          if [ -n "$COUNTIES" ]; then
            CMD="$CMD --counties \"$COUNTIES\""
          fi

          if [ "$FORCE" = "true" ]; then
            CMD="$CMD --force"
          fi

          echo "Running: $CMD"
          eval $CMD
        env:
          WP_CI_CONFIRMED: "YES"

      # 10. Commit the updated inject state file so the next run knows
      #     which counties were already published and can skip unchanged ones.
      - name: Commit publish state
        id: commit_state
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/wp_inject_state.json
          git diff --staged --quiet || \
            git commit -m "chore: update wp publish state [$(date '+%Y-%m-%d %H:%M %Z')]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 11. Final summary — always runs even if publish failed.
      - name: Publish summary
        if: always()
        run: |
          echo "============================================================"
          echo "PUBLISH SUMMARY — $(date '+%Y-%m-%d %H:%M %Z')"
          echo "  Triggered by : ${{ github.actor }}"
          COUNTIES="${{ github.event.inputs.counties }}"
          echo "  Counties     : ${COUNTIES:-ALL}"
          echo "  Force push   : ${{ inputs.force }}"
          echo "------------------------------------------------------------"
          echo "  Render HTML  : ${{ steps.render.outcome }}"
          echo "  WP publish   : ${{ steps.publish.outcome }}"
          echo "  State commit : ${{ steps.commit_state.outcome }}"
          echo "============================================================"

          if [ "${{ steps.render.outcome }}" = "failure" ]; then
            echo "::error::HTML render failed — nothing was published to WordPress."
            echo "Check that data/processed/election_results_master.json exists (run the scrape workflow first)."
            exit 1
          fi

          if [ "${{ steps.publish.outcome }}" = "failure" ]; then
            echo "::error::WordPress publish failed. Common causes:"
            echo "  - WP_APP_PASSWORD secret is wrong or expired"
            echo "  - WP_PAGE_IDS secret is missing or malformed JSON"
            echo "  - A county page ID no longer exists on the site"
            exit 1
          fi

          echo "Publish complete."
