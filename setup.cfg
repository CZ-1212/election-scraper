[pydocstyle]
convention = pep257
# D107: Missing docstring in __init__. Our __init__s only bind attributes
# whose meaning is documented on the class itself.
add_ignore = D107
# Skip the .backup files alongside scrapers and the test_clarity_only.py
# script (a sandbox driver, not a library module).
match = (?!test_clarity_only)(?!.*\.backup).*\.py
match_dir = (?!\.|venv|build|dist|.*\.egg-info).*

# Per-test docstring requirements (D101–D103) are relaxed for the tests/
# tree via tests/.pydocstyle, since pytest function names are already
# descriptive enough.
